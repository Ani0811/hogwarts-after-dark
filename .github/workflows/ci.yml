name: CI & Security Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Tests & Security Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Companion Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./services/companion
          pip install pytest pytest-asyncio structlog ruff bandit

      - name: Ruff Code Quality Lint
        run: |
          ruff check services/companion/

      - name: Bandit Security AST Scanner
        run: |
          bandit -r services/companion/app -ll -ii

      - name: Execute Security & Playthrough Tests
        run: |
          python -m pytest tests/ -v --tb=short

  frontend-quality:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: TypeScript Type Check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Production Static Build
        working-directory: apps/web
        run: npm run build
