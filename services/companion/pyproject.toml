[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hogwarts-after-dark-companion"
version = "0.1.0"
description = "Local companion service for Hogwarts After Dark"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.115.0,<0.140.0",
    "uvicorn[standard]>=0.32.0,<0.45.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "httpx>=0.27.0,<0.30.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "structlog>=24.0.0,<26.0.0",
    "anyio>=4.0.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<0.26.0",
    "httpx>=0.27.0",  # for TestClient
    "ruff>=0.7.0,<1.0.0",
    "bandit>=1.8.0,<2.0.0",
    "pip-audit>=2.7.0,<3.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PIE", "RET", "SIM"]
ignore = ["S101"]  # allow assert in tests

[tool.bandit]
skips = ["B101"]  # allow assert in tests

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

